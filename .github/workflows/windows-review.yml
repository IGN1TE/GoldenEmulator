name: Build Windows review
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native launcher on Windows
        run: python -m unittest -v test_native.py
      - name: Test frontend logic
        run: |
          python -m zipfile -e GoldenEmulator-Desktop-0.6.0-Source.zip source-check
          node --test source-check/tests/library.test.cjs source-check/tests/controller.test.cjs
      - name: Package Windows executable
        run: |
          python -m pip install pyinstaller==6.16.0 pywebview==6.2.1
          python -m PyInstaller --noconfirm --onefile --windowed --name GoldenEmulator --add-data "GoldenEmulator.html;." GoldenEmulator.py
      - name: Check packaged runtime
        shell: pwsh
        run: |
          $checkFile = Join-Path $PWD 'exe-check.json'
          $process = Start-Process -FilePath '.\dist\GoldenEmulator.exe' -ArgumentList @('--self-test', $checkFile) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path $checkFile)) { throw 'Executable smoke test failed' }
          $check = Get-Content $checkFile | ConvertFrom-Json
          if (!$check.ok -or $check.platform -ne 'win32') { throw 'Packaged runtime invalid' }
          Get-Content $checkFile
      - name: Create review ZIP
        shell: pwsh
        run: |
          Copy-Item START-HERE.txt dist\START-HERE.txt
          Compress-Archive -Path dist\GoldenEmulator.exe,dist\START-HERE.txt -DestinationPath GoldenEmulator-Desktop-0.6.0-Windows.zip
          Get-FileHash GoldenEmulator-Desktop-0.6.0-Windows.zip -Algorithm SHA256 | Format-List
      - name: Fetch Microsoft WebView2 bootstrapper
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile MicrosoftEdgeWebview2Setup.exe
          $signature = Get-AuthenticodeSignature MicrosoftEdgeWebview2Setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*O=Microsoft Corporation*') { throw 'WebView2 bootstrapper signature invalid' }
      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Test install, lifecycle and uninstall
        shell: pwsh
        run: ./test_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GoldenEmulator-Desktop-0.6.0-Windows
          path: |
            GoldenEmulator-Desktop-0.6.0-Windows.zip
            installer-dist/GoldenEmulator-Setup-0.6.0.exe
      - name: Publish review prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v0.6.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.6.0 GoldenEmulator-Desktop-0.6.0-Windows.zip installer-dist/GoldenEmulator-Setup-0.6.0.exe --clobber
          } else {
            gh release create v0.6.0 GoldenEmulator-Desktop-0.6.0-Windows.zip installer-dist/GoldenEmulator-Setup-0.6.0.exe --target "$env:GITHUB_SHA" --prerelease --title "GoldenEmulator 0.6.0 — Desktop app" --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
