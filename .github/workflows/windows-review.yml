name: Build Windows review
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native launcher on Windows
        run: python -m unittest -v test_native.py
      - name: Test frontend logic
        run: |
          python -m zipfile -e GoldenEmulator-Stage-3-Source.zip source-check
          node --test source-check/tests/library.test.cjs
      - name: Package Windows executable
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --onefile --windowed --name GoldenEmulator --add-data "GoldenEmulator.html;." GoldenEmulator.py
      - name: Check packaged runtime
        shell: pwsh
        run: |
          $checkFile = Join-Path $PWD 'exe-check.json'
          $process = Start-Process -FilePath '.\dist\GoldenEmulator.exe' -ArgumentList @('--self-test', $checkFile) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path $checkFile)) { throw 'Executable smoke test failed' }
          $check = Get-Content $checkFile | ConvertFrom-Json
          if (!$check.ok -or $check.platform -ne 'win32') { throw 'Packaged runtime invalid' }
          Get-Content $checkFile
      - name: Create review ZIP
        shell: pwsh
        run: |
          Copy-Item START-HERE.txt dist\START-HERE.txt
          Compress-Archive -Path dist\GoldenEmulator.exe,dist\START-HERE.txt -DestinationPath GoldenEmulator-Stage-3-Windows.zip
          Get-FileHash GoldenEmulator-Stage-3-Windows.zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: GoldenEmulator-Stage-3-Windows
          path: GoldenEmulator-Stage-3-Windows.zip
      - name: Publish review prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view stage3-review *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload stage3-review GoldenEmulator-Stage-3-Windows.zip --clobber
          } else {
            gh release create stage3-review GoldenEmulator-Stage-3-Windows.zip --target "$env:GITHUB_SHA" --prerelease --title "Stage 3 Windows review" --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
