const systems=[{name:'GameCube',rect:[54,92,363,327],tag:'NINTENDO'},{name:'Xbox 360',rect:[441,96,564,323],tag:'MICROSOFT'},{name:'PlayStation 5',rect:[1034,96,282,321],tag:'SONY'},{name:'PlayStation 2',rect:[1340,96,190,321],tag:'SONY'}];
const games=[{id:0,title:'Halo 3',system:'Xbox 360',rect:[54,576,413,197]},{id:1,title:'Forza Horizon',system:'Xbox 360',rect:[486,576,367,197]},{id:2,title:'Gears of War',system:'Xbox 360',rect:[871,576,330,197]},{id:3,title:'Call of Duty 4: Modern Warfare',system:'Xbox 360',rect:[1220,576,311,197]}];
let page='Systems',selected=1,filter='',query='',favorites=new Set();try{favorites=new Set(JSON.parse(localStorage.getItem('GoldenEmulator.stage1.favorites')||'[]'))}catch{}
const main=document.getElementById('main'),modal=document.getElementById('modal');
function art(rect){let [x,y,w,h]=rect;return `<div class="art"><img alt="" src="${ART}" style="width:${1536/w*100}%;height:${864/h*100}%;left:${-x/w*100}%;top:${-y/h*100}%"></div>`}
function cards(list){return list.length?list.map(g=>`<button class="game" data-game="${g.id}" aria-label="View ${g.title}"><div class="cover">${art(g.rect)}</div><div class="game-info"><div><strong>${g.title}</strong><small>${g.system} · Sample game</small></div><span class="star">${favorites.has(g.id)?'♥':'♡'}</span></div></button>`).join(''):`<div class="empty"><h2>${page==='Favorites'?'Your favourites start here':query?'No matching games':'No sample games for this system'}</h2><p>${page==='Favorites'?'Open a sample game and add it to favourites.':query?'Try a different title or clear your search.':'Game-folder import will be added in Stage 2.'}</p></div>`}
function render(){document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false')});if(page==='Systems'||page==='Home'){main.innerHTML=`<section aria-label="Console selection"><div class="carousel">${systems.map((s,i)=>`<button class="system ${selected===i?'selected':''}" data-system="${i}" aria-label="${s.name}${selected===i?', browse library':', select system'}" aria-pressed="${selected===i}">${art(s.rect)}<span class="sysname"><small>${s.tag}</small>${s.name}</span><span class="browse">${selected===i?'Browse library →':'Select system'}</span></button>`).join('')}</div></section><div class="section-head"><h2>◷ &nbsp; Recently played</h2><div class="carousel-controls"><button class="round" data-step="-1" aria-label="Previous system">‹</button><button class="round" data-step="1" aria-label="Next system">›</button><button id="see-all" class="subtle">See all &nbsp; ›</button></div></div><div class="games">${cards(games)}</div><p class="note">Preview artwork and sample history. Select a console, then choose Browse library.</p>`}else{let list=games.filter(g=>(!filter||g.system===filter)&&(page!=='Favorites'||favorites.has(g.id))&&g.title.toLowerCase().includes(query.toLowerCase()));main.innerHTML=`<div class="toolbar"><h1>${page==='Favorites'?'Favorites':filter||'Your library'}</h1>${filter?'<button class="chip" id="clear-filter">All systems ×</button>':''}<input aria-label="Search games" class="search" placeholder="Search your games…" id="search"></div><div class="games">${cards(list)}</div><p class="note">Stage 1 sample collection · Game importing and emulator setup come in later stages.</p>`;document.getElementById('search').value=query}bind()}
function navigate(p){page=p;filter='';query='';render()}
function select(i){selected=(i+systems.length)%systems.length;render();let el=document.querySelector('.system.selected');el?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest',inline:'center'})}
function library(){page='Library';filter=systems[selected].name;query='';render()}
function bind(){document.querySelectorAll('[data-system]').forEach(b=>b.onclick=()=>Number(b.dataset.system)===selected?library():select(Number(b.dataset.system)));document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>select(selected+Number(b.dataset.step)));document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>details(Number(b.dataset.game)));document.getElementById('see-all')?.addEventListener('click',()=>navigate('Library'));document.getElementById('clear-filter')?.addEventListener('click',()=>{filter='';render()});document.getElementById('search')?.addEventListener('input',e=>{let pos=e.target.selectionStart;query=e.target.value;render();let input=document.getElementById('search');input.focus();input.setSelectionRange(pos,pos)})}
function openDialog(content){modal.innerHTML=content;modal.showModal();modal.querySelector('[data-close]')?.addEventListener('click',()=>modal.close())}
function details(id){const g=games[id];openDialog(`<div class="dialog-top"><span>SAMPLE GAME · ${g.system.toUpperCase()}</span><button class="close" data-close aria-label="Close">×</button></div><h2>${g.title}</h2><div class="cover" style="border-radius:12px">${art(g.rect)}</div><p>This is a design preview. Game launching and emulator setup will be connected in Stage 3.</p><div class="actions"><button class="primary" id="favorite">${favorites.has(id)?'♥ Remove favourite':'♡ Add to favourites'}</button><button class="secondary" data-close2>Back to browsing</button></div>`);document.querySelector('[data-close2]').onclick=()=>modal.close();document.getElementById('favorite').onclick=()=>{favorites.has(id)?favorites.delete(id):favorites.add(id);try{localStorage.setItem('GoldenEmulator.stage1.favorites',JSON.stringify([...favorites]))}catch{}modal.close();render();details(id)}}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));document.getElementById('settings').onclick=()=>openDialog(`<div class="dialog-top"><span>GOLDENEMULATOR</span><button class="close" data-close aria-label="Close">×</button></div><h2>Preview settings</h2><div class="settings-row"><span>Platform</span><small>Windows desktop</small></div><div class="settings-row"><span>Appearance</span><small>Neon Arcade</small></div><div class="settings-row"><span>Emulators</span><small>Stage 3</small></div><div class="settings-row"><span>Controller support</span><small>Stage 4</small></div><p>Review the spacing, console selection, game cards, and navigation. Your approval is required before Stage 2.</p>`);
document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{openDialog('<h2>Fullscreen</h2><p>Press F11 to toggle fullscreen in your Windows browser.</p><button class="primary" data-close>OK</button>')}};
function search(){navigate('Library');document.getElementById('search').focus()}document.getElementById('search-shortcut').onclick=search;
document.addEventListener('keydown',e=>{if(modal.open||e.target.tagName==='INPUT')return;if(e.key==='/'){e.preventDefault();search()}if(e.key==='Escape')navigate('Systems');if(page==='Systems'||page==='Home'){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();select(selected+(e.key==='ArrowRight'?1:-1))}if(e.key==='Enter'&&(e.target===document.body||e.target===main)){e.preventDefault();library()}}});
function clock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}clock();setInterval(clock,30000);render();
</script></body></html>
